services:
  - type: web
    name: energy-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: ""
      - key: ALLOWED_ORIGINS
        value: "https://energy-tracker.onrender.com"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

server {
    listen 80;
    server_name _;

    # 静的ファイルのルート
    root /usr/share/nginx/html;
    index index.html;

    # gzip 圧縮（JS/CSS を圧縮してレスポンスを高速化）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1024;

    # Garmin FIT アップロード（FITファイルは最大 20MB まで許可）
    location = /api/upload/garmin-fit {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size 20m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # Apple Health アップロード（export.xml は大きいので 2GB まで許可）
    location = /api/upload/apple-health {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        client_max_body_size 2g;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
    }

    # /api/* および /auth/* → backend コンテナへプロキシ
    location ~ ^/(api|auth)/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ファイルアップロード上限（GPX: 10 MB に合わせる）
        client_max_body_size 10m;

        # タイムアウト（シミュレーション計算が長い場合に備える）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA ルーティング：存在しないパスはすべて index.html にフォールバック
    location / {
        try_files $uri $uri/ /index.html;
    }

    # キャッシュ設定
    # ハッシュ付きアセット（JS/CSS）は長期キャッシュ
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html はキャッシュ無効（デプロイ後すぐ反映されるように）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
